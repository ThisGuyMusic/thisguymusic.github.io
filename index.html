<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLY MOLY | Coming Soon</title>
    <style>
        :root {
            --bg-rack: #090b0e;
            --panel-bg: #12161f;
            --panel-border: #242b3d;
            --panel-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 12px 30px rgba(0,0,0,0.8);
            --led-green: #00ff88;
            --accent-cyan: #00d2ff;
            --text-main: #e6edf3;
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-rack);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a2233 0%, transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 4px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Hardware Rack Unit Centered */
        .rack-unit {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-left: 12px solid #1c222d;
            border-right: 12px solid #1c222d;
            border-radius: 6px;
            padding: 45px 50px;
            box-shadow: var(--panel-shadow);
            position: relative;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* Hardware Screws */
        .screw {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #2a3346;
            border-radius: 50%;
            border: 1px solid #12161f;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
        }
        .screw.top-left { top: 12px; left: -8px; }
        .screw.top-right { top: 12px; right: -8px; }
        .screw.bottom-left { bottom: 12px; left: -8px; }
        .screw.bottom-right { bottom: 12px; right: -8px; }

        /* Title & Power LED */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 25px;
        }

        .power-led {
            width: 12px;
            height: 12px;
            background-color: var(--led-green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--led-green);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.6; box-shadow: 0 0 6px var(--led-green); }
            100% { opacity: 1; box-shadow: 0 0 16px var(--led-green); }
        }

        .site-title {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            font-family: var(--font-mono);
        }

        /* Digital Screen Subtitle */
        .status-display {
            background: #080a0d;
            border: 1px solid #1b212c;
            border-radius: 4px;
            padding: 14px 20px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
        }

        .subtitle {
            color: var(--accent-cyan);
            font-family: var(--font-mono);
            font-size: 1.1rem;
            letter-spacing: 6px;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="rack-unit">
        <!-- Hardware Corner Screws -->
        <div class="screw top-left"></div>
        <div class="screw top-right"></div>
        <div class="screw bottom-left"></div>
        <div class="screw bottom-right"></div>

        <!-- Title Header -->
        <div class="brand-header">
            <div class="power-led"></div>
            <h1 class="site-title">OLY MOLY</h1>
        </div>

        <!-- Digital LED Subtitle -->
        <div class="status-display">
            <div class="subtitle">// COMING SOON</div>
        </div>
    </div>

</body>
</html>
